# GCP Cloud Run deploy via Cloud Build.
#
# Required substitutions (set in trigger or via --substitutions):
#   _REGION          GCP region for Cloud Run + Artifact Registry (e.g. us-central1)
#   _SERVICE         Cloud Run service name (e.g. michaelcrowe-ai)
#   _AR_REPO         Artifact Registry repo name (e.g. apps)
#
# One-time setup (run locally):
#   gcloud artifacts repositories create apps \
#     --repository-format=docker --location=$_REGION
#   gcloud run deploy $_SERVICE --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE:bootstrap \
#     --region=$_REGION --allow-unauthenticated --port=3000

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10

substitutions:
  _REGION: us-central1
  _SERVICE: michaelcrowe-ai
  _AR_REPO: apps

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

timeout: 1800s
